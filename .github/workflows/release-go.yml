name: release-go

# Builds the Go binary and container image for every published GitHub release,
# then generates SLSA Level 3 provenance for both using slsa-github-generator.
#
# Security model:
#   - Only maintainers who can create a GitHub release trigger this workflow.
#   - Provenance is signed via Sigstore's keyless scheme (OIDC → Fulcio CA →
#     Rekor transparency log), so verifiers need no pre-shared key.
#   - The slsa-github-generator reusable workflow runs in an isolated job that
#     the calling repo cannot influence; see the SLSA threat model for details.
#   - Branch protection must restrict who can push tags / create releases
#     (see docs/branch-protection.md).
#
# Triggering:
#   - Automatically on GitHub release publish (tags of the form vX.Y.Z).
#   - Manual workflow_dispatch for backfills / testing (no publish to ghcr.io
#     unless a real release tag is supplied).
#
# Provenance files uploaded to the release:
#   - stellabill-backend.intoto.jsonl   (binary provenance)
#   - Container attestation pushed to GHCR alongside the image digest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3). Defaults to the latest tag."
        required: false
        default: ''
        type: string

# Principle of least-privilege: individual jobs request only what they need.
permissions: read-all

env:
  IMAGE_REGISTRY: ghcr.io
  # github.repository is  "org/repo", giving e.g. ghcr.io/Stellabill/stellabill-backend
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 – Compute build metadata (ldflags, version string)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  args:
    name: Compute build metadata
    runs-on: ubuntu-latest
    outputs:
      commit-date: ${{ steps.meta.outputs.commit-date }}
      commit:      ${{ steps.meta.outputs.commit }}
      version:     ${{ steps.meta.outputs.version }}
      tree-state:  ${{ steps.meta.outputs.tree-state }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "${TAG:-}" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0-dev")
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Compute ldflags metadata
        id: meta
        run: |
          set -euo pipefail
          echo "commit-date=$(git log --date=iso8601-strict -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}"                                           >> "$GITHUB_OUTPUT"
          # Strip leading 'v' for semver-clean version string
          echo "version=$(echo '${{ steps.tag.outputs.tag }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "tree-state=$(if git diff --quiet; then echo clean; else echo dirty; fi)" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 – Build Go binary and generate SLSA Level 3 provenance
#
# The trusted builder runs entirely inside slsa-github-generator's isolated
# environment; this repo's code cannot influence the provenance document.
# ─────────────────────────────────────────────────────────────────────────────
  binary-provenance:
    name: Build binary + SLSA provenance
    needs: [args]
    permissions:
      id-token: write  # Sign provenance via Sigstore OIDC
      contents: write  # Upload provenance to GitHub release
      actions: read    # Read workflow path for provenance
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      go-version-file: go.mod
      # Pass the version so ldflags can embed it; the builder only accepts
      # env vars prefixed with GO or CGO_.
      evaluated-envs: "GOFLAGS:-ldflags=-X main.Version=${{ needs.args.outputs.version }} -X main.CommitDate=${{ needs.args.outputs.commit-date }} -X main.Commit=${{ needs.args.outputs.commit }} -X main.TreeState=${{ needs.args.outputs.tree-state }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 – Build container image and push to GHCR
# ─────────────────────────────────────────────────────────────────────────────
  build-container:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [args]
    permissions:
      contents: read
      packages: write
    outputs:
      image:  ${{ steps.image-name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: vtag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.vtag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.vtag.outputs.tag }}
            type=sha,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vtag.outputs.tag }}
          # Use cache from the registry to speed up rebuilds
          cache-from: type=registry,ref=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Produce a single manifest (not a multi-arch index) — the Dockerfile
          # targets linux/amd64 explicitly via CGO_ENABLED=0 GOOS=linux GOARCH=amd64.
          provenance: false  # We generate provenance via slsa-github-generator below

      - name: Emit image name output
        id: image-name
        run: |
          # Omit tag/digest — generator_container_slsa3 expects a bare name
          echo "image=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# Job 4 – Generate SLSA Level 3 container provenance
#
# Attestation is pushed as an OCI artifact alongside the image in GHCR.
# ─────────────────────────────────────────────────────────────────────────────
  container-provenance:
    name: Container SLSA provenance
    needs: [build-container]
    # Only generate provenance for real tagged releases (or explicit dispatch)
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions:  read   # Detect GitHub Actions environment
      id-token: write  # Create OIDC token for Sigstore signing
      packages: write  # Push attestation to GHCR
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image:             ${{ needs.build-container.outputs.image }}
      digest:            ${{ needs.build-container.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 5 – Dry-run staging deploy with provenance verification gate
#
# This job demonstrates the enforcement pattern: staging deploy is blocked
# unless slsa-verifier confirms the binary provenance is valid.  In a real
# deployment the "echo" steps become actual deploy commands.
# ─────────────────────────────────────────────────────────────────────────────
  verify-and-deploy-staging:
    name: Verify provenance → staging deploy (dry-run)
    runs-on: ubuntu-latest
    needs: [binary-provenance, container-provenance]
    # Only run on real tag releases
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    environment:
      name: staging
      url: https://staging.stellabill.example.com
    steps:
      - name: Install slsa-verifier
        env:
          # Pin to a known-good release; update via Dependabot
          SLSA_VERIFIER_VERSION: "2.6.0"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64" \
            -o /usr/local/bin/slsa-verifier
          chmod +x /usr/local/bin/slsa-verifier
          # Verify the verifier binary itself (bootstrapping trust)
          curl -sSfL \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64.intoto.jsonl" \
            -o slsa-verifier.intoto.jsonl
          slsa-verifier verify-artifact /usr/local/bin/slsa-verifier \
            --provenance-path slsa-verifier.intoto.jsonl \
            --source-uri github.com/slsa-framework/slsa-verifier \
            --source-tag "v${SLSA_VERIFIER_VERSION}" \
            || { echo "::error::slsa-verifier bootstrap verification failed"; exit 1; }
          rm slsa-verifier.intoto.jsonl

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.binary-provenance.outputs.go-binary-name }}

      - name: Download binary provenance
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.binary-provenance.outputs.go-provenance-name }}

      - name: Verify binary provenance
        env:
          BINARY:     ${{ needs.binary-provenance.outputs.go-binary-name }}
          PROVENANCE: ${{ needs.binary-provenance.outputs.go-provenance-name }}
        run: |
          set -euo pipefail
          echo "=== Verifying SLSA provenance for ${BINARY} ==="
          slsa-verifier verify-artifact "${BINARY}" \
            --provenance-path "${PROVENANCE}" \
            --source-uri     "github.com/${{ github.repository }}" \
            --source-tag     "${{ github.ref_name }}"
          echo "::notice::SLSA binary provenance verified ✓"

      - name: Verify container provenance
        env:
          DIGEST: ${{ needs.build-container.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "=== Verifying SLSA provenance for ${IMAGE}@${DIGEST} ==="
          slsa-verifier verify-image "${IMAGE}@${DIGEST}" \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "${{ github.ref_name }}"
          echo "::notice::SLSA container provenance verified ✓"

      # ── If either verification step fails, this step is never reached ──────
      - name: Staging deploy (dry-run)
        run: |
          set -euo pipefail
          echo "=== Provenance gates passed — proceeding to staging deploy ==="
          echo "IMAGE:   ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-container.outputs.digest }}"
          echo "VERSION: ${{ github.ref_name }}"
          echo ""
          echo "[dry-run] kubectl set image deployment/stellabill-backend \\"
          echo "          stellabill-backend=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-container.outputs.digest }}"
          echo ""
          echo "In production: replace this step with your actual deploy command."
          echo "The deployment proceeds only because slsa-verifier exited 0 above."
