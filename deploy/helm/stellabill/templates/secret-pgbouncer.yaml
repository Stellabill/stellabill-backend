{{- if .Values.pgbouncer.enabled }}
---
# Secret: pgbouncer-credentials
# Placeholder Secret. In production, populate this via your secrets manager
# (e.g. External Secrets Operator, Vault Agent, AWS Secrets Manager CSI driver).
# NEVER commit real values to this file.
#
# Required keys:
#   db-host        - Postgres host (e.g. "postgres.db.svc.cluster.local")
#   db-port        - Postgres port (e.g. "5432")
#   db-name        - Database name
#   db-user        - Database user
#   db-password    - Database password (used to write userlist.txt)
#   database-url   - Full connection string (postgres://user:pass@host:port/db)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pgbouncer.credentialsSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app: stellabill
    component: pgbouncer
  annotations:
    # Mark this Secret as managed externally so an operator knows not to
    # overwrite it. Replace this placeholder before deploying.
    stellabill.io/managed-by: "external-secrets"
    helm.sh/resource-policy: keep
type: Opaque
# Placeholder base64 values — REPLACE before deploying.
# echo -n 'your-value' | base64
data:
  db-host: cGxhY2Vob2xkZXI=       # placeholder
  db-port: NTQzMg==                # 5432
  db-name: cGxhY2Vob2xkZXI=       # placeholder
  db-user: cGxhY2Vob2xkZXI=       # placeholder
  db-password: cGxhY2Vob2xkZXI=   # placeholder
  database-url: cGxhY2Vob2xkZXI=  # placeholder
{{- end }}
