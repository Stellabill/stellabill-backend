; pgbouncer.ini — Stellabill PgBouncer sidecar configuration template
;
; This file is mounted at /etc/pgbouncer/pgbouncer.ini inside the sidecar
; container. Backend host/port/dbname are injected via environment variables
; (substituted by the pgbouncer image entrypoint). Credentials are written to
; /etc/pgbouncer/userlist.txt by an init container and never stored here.
;
; Tuning cheat-sheet:
;   default_pool_size = floor(postgres_max_connections / pod_count) - reserve
;   max_client_conn   = default_pool_size × 4  (generous; pgbouncer queues excess)
;   idle_transaction_timeout ≤ DB_POOL_MAX_CONN_IDLE_TIME (env var in the Go app)
;
; Reference: https://www.pgbouncer.org/config.html

[databases]
; Route every client-side database name to the backend Postgres.
; Backend coordinates are supplied by environment variables at startup.
; Syntax: <alias> = host=<host> port=<port> dbname=<dbname>
* = host=$(PGBOUNCER_DB_HOST) port=$(PGBOUNCER_DB_PORT) dbname=$(PGBOUNCER_DB_NAME)

[pgbouncer]
; ── Connectivity ──────────────────────────────────────────────────────────────
; Bind to loopback only; the API container and this sidecar share the pod
; network namespace. No other pod can reach this port via NetworkPolicy or
; because 127.0.0.1 is not reachable across pod boundaries.
listen_addr = 127.0.0.1
listen_port = 5432

; ── Pooling mode ──────────────────────────────────────────────────────────────
; transaction: each backend connection is returned to the pool after every
; transaction (BEGIN/COMMIT). This absorbs connection storms during pod
; restarts and allows many application goroutines to share few backend PIDs.
;
; REQUIRED: the application MUST set DB_STATEMENT_CACHE_MODE=describe (or
; "simple") so pgx does not send prepared-statement Parse messages. Named
; prepared statements persist on the backend connection, but in transaction
; mode the next client may get a different backend connection that does not
; know about them — causing "prepared statement does not exist" errors.
pool_mode = transaction

; ── Pool sizing ───────────────────────────────────────────────────────────────
; max_client_conn: ceiling on simultaneous application-side connections.
; PgBouncer queues clients when the pool is full; connections are never refused.
; Set this well above default_pool_size to absorb burst traffic.
max_client_conn = 100

; default_pool_size: backend connections opened per (user, db) pair.
; Budget: postgres max_connections / number_of_pods - safety_margin.
; Example: max_connections=100, 4 pods → 25 each (leaving 0 for admin/DBA).
default_pool_size = 25

; min_pool_size: connections kept open even when idle.
; Avoids cold-start latency after quiet periods.
min_pool_size = 2

; reserve_pool_size: extra backend connections reserved for bursts.
; Borrowed only when the normal pool is exhausted.
reserve_pool_size = 5

; reserve_pool_timeout: seconds to wait before borrowing from the reserve pool.
reserve_pool_timeout = 3

; ── Timeouts ──────────────────────────────────────────────────────────────────
; server_idle_timeout: close idle backend connections after this many seconds.
; Must be shorter than any firewall/NAT idle-timeout between the pod and Postgres
; (typically 300–900 s for cloud VPCs). Corresponds to DB_POOL_MAX_CONN_IDLE_TIME.
server_idle_timeout = 600

; server_lifetime: recycle backend connections after this many seconds.
; Spreads load across Postgres backend PIDs and helps recover after failovers.
; Should match or be slightly shorter than DB_POOL_MAX_CONN_LIFETIME.
server_lifetime = 3600

; query_wait_timeout: cancel a waiting client after this many seconds.
; Prevents client goroutines from blocking indefinitely when the pool is saturated.
query_wait_timeout = 120

; idle_transaction_timeout: abort transactions idle longer than this many seconds.
; Prevents runaway connections that hold a backend slot without making progress.
; Set to 0 to disable (not recommended in production; use a short value instead).
; This value is controlled by the PGBOUNCER_IDLE_IN_TX_TIMEOUT env var in the
; Go application config (PgBouncerIdleInTxTimeout, default 30 s).
idle_transaction_timeout = 30

; ── Authentication ────────────────────────────────────────────────────────────
; auth_type = scram-sha-256 requires PgBouncer 1.21+ and Postgres 10+.
; Use md5 if your Postgres version does not support SCRAM.
auth_type = scram-sha-256

; userlist.txt is written by the init container at pod startup.
; Format: "<username>" "<md5hash-or-plaintext-password>"
; Never commit this file or embed credentials in this config.
auth_file = /etc/pgbouncer/userlist.txt

; ── Admin interface ───────────────────────────────────────────────────────────
; Disabled by default. Enable only for debugging from within the pod.
; admin_users = pgbouncer_admin

; ── Logging ───────────────────────────────────────────────────────────────────
; Write to stdout so the container runtime captures log lines.
logfile =
pidfile =

; log_connections / log_disconnections: set to 1 for debugging, 0 in production
; to avoid log noise.
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; verbose: 0=off, 1=debug queries, 5=full debug. Never use 5 in production.
verbose = 0

; ── TLS (backend to Postgres) ─────────────────────────────────────────────────
; Uncomment and adjust to require TLS when connecting to the Postgres backend.
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt
; server_tls_cert_file = /etc/pgbouncer/server.crt
; server_tls_key_file  = /etc/pgbouncer/server.key

; ── Prepared statements note ──────────────────────────────────────────────────
; In transaction pooling mode, the server connection is returned to the pool
; after each transaction. A subsequent client may receive a different backend
; connection that has no knowledge of prepared statements from previous clients.
;
; The Go application handles this by setting:
;   DB_STATEMENT_CACHE_MODE=describe
; which causes pgx to use DescribeStatement (type inference only) instead of
; sending a Parse message that registers a named prepared statement on the
; backend. See internal/db/pool.go for implementation details.
;
; PgBouncer 1.21+ can forward PREPARE/EXECUTE across connections via
; track_extra_parameters, but this requires session pooling and is not needed
; when the application has been configured correctly.
