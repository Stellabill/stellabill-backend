apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stellabill-staging

bases:
  - ../../base

# Staging-specific patches
patches:
  # Reduce replicas for cost savings in staging
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: stellabill-api

  # Staging-specific PgBouncer pool size (fewer backend connections)
  - path: patch-pgbouncer-config.yaml

# Override images with staging tags
images:
  - name: stellabill-backend
    newTag: staging-latest
  - name: pgbouncer/pgbouncer
    newTag: "1.23.1"
