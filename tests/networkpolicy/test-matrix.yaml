---
# Test: API can resolve DNS
- name: api-to-dns
  from:
    namespace: default
    pod:
      matchLabels:
        tier: api
        component: backend
  to:
    namespace: kube-system
    pod:
      matchLabels:
        k8s-app: kube-dns
  ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  expected: allow

---
# Test: Worker can resolve DNS
- name: worker-to-dns
