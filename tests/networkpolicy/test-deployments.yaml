  - port: 6379
    targetPort: 6379
    protocol: TCP
---
# Kafka Messaging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellabill-kafka
  labels:
    app: stellabill
    tier: messaging
    component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stellabill
      tier: messaging
      component: kafka
  template:
    metadata:
      labels:
        app: stellabill
        tier: messaging
        component: kafka
    spec:
      containers:
      - name: kafka
        image: bitnami/kafka:3.5
        env:
        - name: KAFKA_CFG_NODE_ID
          value: "0"
        - name: KAFKA_CFG_PROCESS_ROLES
          value: "controller,broker"
        - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
          value: "0@localhost:9093"
        - name: KAFKA_CFG_LISTENERS
          value: "PLAINTEXT://:9092,CONTROLLER://:9093"
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          value: "PLAINTEXT://:9092"
        - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        ports:
        - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: stellabill-kafka
  labels:
    app: stellabill
    tier: messaging
spec:
  selector:
    app: stellabill
    tier: messaging
    component: kafka
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
