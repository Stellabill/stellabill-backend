apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-credentials
  labels:
    app: stellabill
    component: pgbouncer
  annotations:
    # Mark this Secret as externally managed (e.g. by External Secrets Operator
    # or a Vault Agent sidecar injector) in production.  The base manifest
    # provides placeholder values so Kustomize validates the schema; overlays
    # replace these with real values or remove the data block entirely when
    # using an external secret manager.
    #
    # NEVER commit real credentials here.  Use a secrets manager and reference
    # this Secret by name from the deployment.
    stellabill.io/managed-by: "external-secrets"
type: Opaque
# Placeholder base64-encoded values (echo -n 'placeholder' | base64).
# Overlays MUST replace these with real secrets.
data:
  db-host: cGxhY2Vob2xkZXI=         # placeholder
  db-port: NTQzMg==                  # 5432
  db-name: cGxhY2Vob2xkZXI=         # placeholder
  db-user: cGxhY2Vob2xkZXI=         # placeholder
  db-password: cGxhY2Vob2xkZXI=     # placeholder
  database-url: cGxhY2Vob2xkZXI=    # placeholder full DATABASE_URL
