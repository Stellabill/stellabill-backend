# NetworkPolicy Test Matrix for netpol-cli
# This file defines the expected connectivity matrix for validation

---
# Test: API can reach Database
- name: api-to-database
  from:
    namespace: default
    pod:
      matchLabels:
        tier: api
        component: backend
  to:
    namespace: default
    pod:
      matchLabels:
        tier: database
        component: postgresql
  ports:
    - protocol: TCP
      port: 5432
  expected: allow

---
# Test: API can reach Redis
- name: api-to-redis
  from:
    namespace: default
    pod:
      matchLabels:
        tier: api
        component: backend
  to:
    namespace: default
    pod:
      matchLabels:
        tier: cache
        component: redis
  ports:
    - protocol: TCP
      port: 6379
  expected: allow

---
# Test: API cannot reach Kafka (should be blocked)
- name: api-to-kafka-blocked
  from:
    namespace: default
    pod:
      matchLabels:
        tier: api
        component: backend
  to:
    namespace: default
    pod:
      matchLabels:
        tier: messaging
        component: kafka
  ports:
    - protocol: TCP
      port: 9092
  expected: deny

