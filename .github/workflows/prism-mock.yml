name: Prism OpenAPI Mock Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'openapi/**'
      - 'tests/pact/**'

jobs:
  prism-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Prism mock server
        run: |
          docker run -d --name prism -p 4010:4010 -v "$PWD/openapi:/spec" stoplight/prism:5 mock -h 0.0.0.0 /spec/openapi.yaml

      - name: Wait for Prism
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4010/api/health >/dev/null 2>&1; then
              echo "Prism ready"
              break
            fi
            sleep 2
          done

      - name: Replay recorded request corpus
        run: |
          python3 scripts/prism_replay.py tests/pact/prism-replay-corpus.json http://localhost:4010

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-coverage
          path: prism-coverage.json
