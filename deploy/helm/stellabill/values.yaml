# Default values for stellabill
# This is a YAML-formatted file.

# ─────────────────────────────────────────────────────────────────────────────
# Argo Rollouts — Canary Strategy
#
# Set rollout.enabled=true to replace the api Deployment with an Argo Rollouts
# Rollout resource. Requires the Argo Rollouts controller to be installed.
#
# Traffic steps: 10% → 25% → 50% → 100%
# Each step runs automated analysis on p99 latency and 5xx error rate.
# Failed analysis triggers an automatic abort and rollback to the stable revision.
#
# Install Argo Rollouts:
#   kubectl create namespace argo-rollouts
#   kubectl apply -n argo-rollouts \
#     -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
# ─────────────────────────────────────────────────────────────────────────────
rollout:
  # enabled: set to true to use Argo Rollouts instead of plain Deployment for api.
  enabled: false

  revisionHistoryLimit: 3

  canary:
    # Pause durations between traffic weight steps.
    step1PauseDuration: "2m"   # 10% → wait → 25%
    step2PauseDuration: "2m"   # 25% → wait → 50%
    step3PauseDuration: "5m"   # 50% → wait → 100%

    # Seconds to wait before scaling down the canary after abort.
    abortScaleDownDelaySeconds: 30
    # Seconds to wait before scaling down after a successful promotion.
    scaleDownDelaySeconds: 30

  analysis:
    # Name of the AnalysisTemplate created by this chart.
    templateName: "stellabill-canary-analysis"

    # Prometheus endpoint reachable from the Argo Rollouts controller.
    prometheusAddress: "http://prometheus-operated.monitoring.svc.cluster.local:9090"

    # How often to query Prometheus during analysis (seconds).
    intervalSeconds: 60

    # Total number of measurements per metric per analysis run.
    count: 5

    # How many consecutive failures before the analysis is marked Failed.
    failureLimit: 1

    # How many Inconclusive results (zero samples) are tolerated before abort.
    inconclusiveLimit: 3

    # p99 latency threshold in milliseconds. Exceeding this fails the analysis.
    p99LatencyThresholdMs: 500

    # 5xx error rate threshold (0–1 fraction). Exceeding this fails the analysis.
    # 0.01 = 1% error rate.
    errorRateThreshold: 0.01



# Global image configuration
image:
  repository: stellabill/backend
  tag: latest
  pullPolicy: IfNotPresent

# Network Policy Configuration
networkPolicy:
  enabled: true
  # Default-deny egress policy
  defaultDenyEgress: true
  # DNS egress is always allowed for cluster functionality
  allowDNS: true
  # DNS server configuration (typically CoreDNS in kube-system)
  dnsNamespace: kube-system
  dnsPort: 53

# API Service Configuration
api:
  name: stellabill-api
  replicas: 2
  labels:
    app: stellabill
    tier: api
    component: backend
  port: 8080
  serviceAccountName: ""
  imagePullSecrets: []
  container:
    portName: http
    port: 8080
    command: []
    args: []
    env: []
    envFrom: []
    volumeMounts: []
    volumes: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe: {}
  readinessProbe: {}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}
  podDisruptionBudget:
    enabled: true
    # minAvailable must respect HPA minReplicas (minReplicas=2 => minAvailable=1)
    # For single-node dev clusters, override with maxUnavailable: 1
    minAvailable: 1
    maxUnavailable: null
  # Coordinate with GRACEFUL_SHUTDOWN_TIMEOUT (default 30s). The application
  # drains HTTP server → DB pool sequentially, each bounded by 30s. Set
  # terminationGracePeriodSeconds >= 65 (2*30 + 5 buffer).
  terminationGracePeriodSeconds: 65
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    # For node-level spread, use: topologyKey: kubernetes.io/hostname
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Worker Service Configuration
worker:
  name: stellabill-worker
  replicas: 2
  labels:
    app: stellabill
    tier: worker
    component: background-jobs
  serviceAccountName: ""
  imagePullSecrets: []
  container:
    portName: http
    port: 8080
    command: []
    args: []
    env: []
    envFrom: []
    volumeMounts: []
    volumes: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe: {}
  readinessProbe: {}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
  # Coordinate with GRACEFUL_SHUTDOWN_TIMEOUT — see api section above.
  terminationGracePeriodSeconds: 65
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database Configuration
database:
  name: stellabill-db
  labels:
    app: stellabill
    tier: database
    component: postgresql
  port: 5432

# Redis Configuration
redis:
  name: stellabill-redis
  labels:
    app: stellabill
    tier: cache
    component: redis
  port: 6379

# Kafka Configuration
kafka:
  name: stellabill-kafka
  labels:
    app: stellabill
    tier: messaging
    component: kafka
  port: 9092

# PgBouncer Sidecar Configuration
pgbouncer:
  # enabled: when true, the deployment template injects the PgBouncer sidecar
  # and sets DB_STATEMENT_CACHE_MODE=describe on the application container.
  enabled: false

  # image: use an immutable tag in production; update via CI/CD pipeline.
  image: pgbouncer/pgbouncer
  imageTag: "1.23.1"

  # credentials: name of the Secret that holds db-host, db-port, db-name,
  # db-user, db-password, and database-url keys.
  # The Secret must exist before the Deployment is applied.
  credentialsSecret: pgbouncer-credentials

  # listen: address and port the sidecar binds to inside the pod.
  # Keep 127.0.0.1 (loopback) so no other pod can reach the pooler.
  listenAddr: "127.0.0.1"
  listenPort: 5432

  # pooling
  poolMode: transaction
  maxClientConn: 100
  defaultPoolSize: 25
  minPoolSize: 2
  reservePoolSize: 5
  reservePoolTimeout: 3

  # timeouts (seconds)
  serverIdleTimeout: 600
  serverLifetime: 3600
  queryWaitTimeout: 120
  idleTransactionTimeout: 30

  # auth
  authType: scram-sha-256

  # logging (0=off, 1=errors, 2=connections, 5=debug)
  logConnections: 0
  logDisconnections: 0
  logPoolerErrors: 1

  # resources for the sidecar container
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "64Mi"
