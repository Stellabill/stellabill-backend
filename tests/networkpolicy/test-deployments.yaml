---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellabill-api
  labels:
    app: stellabill
    tier: api
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stellabill
      tier: api
      component: backend
  template:
    metadata:
      labels:
        app: stellabill
        tier: api
        component: backend
    spec:
      containers:
      - name: api
        image: nicolaka/netshoot:latest
        command: ["/bin/bash", "-c", "while true; do sleep 3600; done"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: stellabill-api
  labels:
    app: stellabill
    tier: api
spec:
  selector:
    app: stellabill
    tier: api
    component: backend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
---
# Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellabill-worker
  labels:
    app: stellabill
    tier: worker
    component: background-jobs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stellabill
      tier: worker
      component: background-jobs
  template:
    metadata:
      labels:
        app: stellabill
        tier: worker
        component: background-jobs
    spec:
      containers:
      - name: worker
        image: nicolaka/netshoot:latest
        command: ["/bin/bash", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: stellabill-worker
  labels:
    app: stellabill
    tier: worker
spec:
  selector:
    app: stellabill
    tier: worker
    component: background-jobs
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
---
# PostgreSQL Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellabill-db
  labels:
    app: stellabill
    tier: database
    component: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stellabill
      tier: database
      component: postgresql
  template:
    metadata:
      labels:
        app: stellabill
        tier: database
        component: postgresql
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: testpass
        - name: POSTGRES_DB
          value: stellabill
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: stellabill-db
  labels:
    app: stellabill
    tier: database
spec:
  selector:
    app: stellabill
    tier: database
    component: postgresql
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
---
