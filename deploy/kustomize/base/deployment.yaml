apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellabill-api
  labels:
    app: stellabill
    tier: api
    component: backend
spec:
  replicas: 2
  # Coordinate with GRACEFUL_SHUTDOWN_TIMEOUT (default 30s). The
  # application drains the HTTP server first (up to
  # GRACEFUL_SHUTDOWN_TIMEOUT), then drains the DB pool (up to another
  # GRACEFUL_SHUTDOWN_TIMEOUT). Add a 5s buffer so Kubernetes doesn't
  # SIGKILL the pod while the pool is still draining.
  # Formula: >= 2 * GRACEFUL_SHUTDOWN_TIMEOUT + 5
  # Default: >= 65 seconds (30 + 30 + 5).
  terminationGracePeriodSeconds: 65
  selector:
    matchLabels:
      app: stellabill
      tier: api
  template:
    metadata:
      labels:
        app: stellabill
        tier: api
        component: backend
      annotations:
        # Prometheus scrape annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Security: run as non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534

      # Shared volume for the PgBouncer userlist.txt (written by init container)
      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-userlist
          emptyDir: {}

      # Init container writes the HBA userlist from the Secret so the main
      # pgbouncer.ini can reference /etc/pgbouncer/userlist.txt without
      # embedding credentials in the ConfigMap.
      initContainers:
        - name: pgbouncer-userlist-init
          image: busybox:1.36.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              echo "\"${PGBOUNCER_DB_USER}\" \"${PGBOUNCER_DB_PASSWORD}\"" \
                > /etc/pgbouncer/userlist.txt
          env:
            - name: PGBOUNCER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-credentials
                  key: db-user
            - name: PGBOUNCER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-credentials
                  key: db-password
          volumeMounts:
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer

      containers:
        # ── Application container ─────────────────────────────────────────────
        - name: stellabill-api
          image: stellabill-backend:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Tell the Go pool to connect through the sidecar on localhost:5432
            - name: PGBOUNCER_ENABLED
              value: "true"
            - name: PGBOUNCER_HOST
              value: "127.0.0.1"
            - name: PGBOUNCER_PORT
              value: "5432"
            # Transaction pooling requires "describe" (no prepared statements)
            - name: DB_STATEMENT_CACHE_MODE
              value: "describe"
            # DATABASE_URL still points to the real Postgres for the DSN
            # (user, dbname, sslmode); the host/port are overridden by the
            # PgBouncer settings above at runtime.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-credentials
                  key: database-url
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

        # ── PgBouncer sidecar ─────────────────────────────────────────────────
        # Listens on 127.0.0.1:5432 (loopback only — see networkpolicy for
        # egress rules). Uses transaction pooling mode. Prepared statements are
        # disabled by the application (DB_STATEMENT_CACHE_MODE=describe).
        - name: pgbouncer
          image: pgbouncer/pgbouncer:1.23.1
          ports:
            - name: pgbouncer
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGBOUNCER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-credentials
                  key: db-host
            - name: PGBOUNCER_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-credentials
                  key: db-port
            - name: PGBOUNCER_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-credentials
                  key: db-name
            - name: PGBOUNCER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-credentials
                  key: db-user
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: false  # pgbouncer needs to write pid file
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
