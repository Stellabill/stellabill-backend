---
# Test: Database cannot initiate outbound connections
- name: database-egress-blocked
  from:
    namespace: default
    pod:
      matchLabels:
        tier: database
        component: postgresql
  to:
    namespace: default
    pod:
      matchLabels:
        tier: api
        component: backend
  ports:
    - protocol: TCP
      port: 8080
  expected: deny
