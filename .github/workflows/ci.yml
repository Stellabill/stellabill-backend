name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting check
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)"
      - name: OpenAPI validation
        run: go run ./cmd/openapi-validate
      - name: OpenAPI examples lint
        run: go run ./tools/openapi-lint
      - name: Migration Safety Validation
        run: go run ./cmd/validate-migrations
      - name: ADR lint (unique numbers + index)
        run: make docs-lint

  test:
    name: Test (Go ${{ matrix.go }}, PG ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
        postgres: ['15', '16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Run tests (JUnit XML)
        run: |
          gotestsum --junitfile test-results.xml --format standard-verbose -- ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-go${{ matrix.go }}-pg${{ matrix.postgres }}
          path: test-results.xml

  coverage:
    name: Coverage (>= 95%)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Coverage (>= 95% for non-cmd packages)
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -v '^stellarbill-backend/cmd/')
          coverpkgs=$(echo "$pkgs" | paste -sd, -)
          go test -count=1 -coverpkg="$coverpkgs" -coverprofile=coverage.out $pkgs
          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          python3 - <<PY
          total=float("$total")
          print(f"Total coverage (non-cmd): {total:.1f}%")
          raise SystemExit(0 if total >= 95.0 else 1)
          PY

  benchmark-thresholds:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Run baseline benchmarks
        run: |
          go test ./internal/handlers/... -bench=. -benchmem -benchtime=1s -count=1 | tee baseline.txt

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Run current benchmarks
        run: |
          go test ./internal/handlers/... -bench=. -benchmem -benchtime=1s -count=1 | tee current.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare benchmarks
        run: |
          echo "## Benchmark Comparison" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          benchstat baseline.txt current.txt | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for regressions
        run: |
          REGRESSION_PCT=20
          if benchstat baseline.txt current.txt | grep -E "\+[2-9][0-9]\.[0-9]+%|\+[0-9]{3,}" > /dev/null 2>&1; then
            echo "❌ Performance regression detected (>${REGRESSION_PCT}%)"
            benchstat baseline.txt current.txt
            exit 1
          fi
          echo "✅ No significant regressions (<${REGRESSION_PCT}%)"
