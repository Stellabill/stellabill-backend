---
# Stellabill API Deployment
# When .Values.pgbouncer.enabled is true a PgBouncer sidecar is injected:
#   - An init container writes /etc/pgbouncer/userlist.txt from the Secret so
#     credentials never appear in the ConfigMap.
#   - The sidecar listens on 127.0.0.1:{{ .Values.pgbouncer.listenPort }} (loopback only).
#   - The application container is configured with PGBOUNCER_ENABLED=true and
#     DB_STATEMENT_CACHE_MODE=describe (required for transaction pooling).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app: stellabill
    tier: {{ .Values.api.labels.tier }}
    component: {{ .Values.api.labels.component }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: stellabill
      tier: {{ .Values.api.labels.tier }}
      component: {{ .Values.api.labels.component }}
  template:
    metadata:
      labels:
        app: stellabill
        tier: {{ .Values.api.labels.tier }}
        component: {{ .Values.api.labels.component }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        {{- if .Values.pgbouncer.enabled }}
        # Restart pods when the PgBouncer ConfigMap changes.
        checksum/pgbouncer-config: {{ include (print $.Template.BasePath "/configmap-pgbouncer.yaml") . | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534

      {{- if .Values.pgbouncer.enabled }}
      volumes:
        - name: pgbouncer-config
          configMap:
            name: {{ .Release.Name }}-pgbouncer-config
        - name: pgbouncer-userlist
          emptyDir: {}

      # Init container: write userlist.txt from the Secret so the main
      # pgbouncer.ini references /etc/pgbouncer/userlist.txt without
      # embedding credentials in the ConfigMap.
      initContainers:
        - name: pgbouncer-userlist-init
          image: busybox:1.36.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              printf '"%s" "%s"\n' "${PGBOUNCER_DB_USER}" "${PGBOUNCER_DB_PASSWORD}" \
                > /etc/pgbouncer/userlist.txt
          env:
            - name: PGBOUNCER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgbouncer.credentialsSecret }}
                  key: db-user
            - name: PGBOUNCER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgbouncer.credentialsSecret }}
                  key: db-password
          volumeMounts:
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer
      {{- end }}

      containers:
        # ── Application container ───────────────────────────────────────────
        - name: {{ .Values.api.name }}
          image: stellabill-backend:latest
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.pgbouncer.enabled }}{{ .Values.pgbouncer.credentialsSecret }}{{ else }}stellabill-secrets{{ end }}
                  key: database-url
            {{- if .Values.pgbouncer.enabled }}
            # Route connections through the PgBouncer sidecar.
            - name: PGBOUNCER_ENABLED
              value: "true"
            - name: PGBOUNCER_HOST
              value: {{ .Values.pgbouncer.listenAddr | quote }}
            - name: PGBOUNCER_PORT
              value: {{ .Values.pgbouncer.listenPort | quote }}
            # Transaction pooling requires describe mode (no prepared statements).
            - name: DB_STATEMENT_CACHE_MODE
              value: "describe"
            {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20

        {{- if .Values.pgbouncer.enabled }}
        # ── PgBouncer sidecar ─────────────────────────────────────────────────
        # Listens on {{ .Values.pgbouncer.listenAddr }}:{{ .Values.pgbouncer.listenPort }} (loopback only).
        # Uses transaction pooling. The application disables prepared statements
        # via DB_STATEMENT_CACHE_MODE=describe.
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image }}:{{ .Values.pgbouncer.imageTag }}
          ports:
            - name: pgbouncer
              containerPort: {{ .Values.pgbouncer.listenPort }}
              protocol: TCP
          env:
            - name: PGBOUNCER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgbouncer.credentialsSecret }}
                  key: db-host
            - name: PGBOUNCER_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgbouncer.credentialsSecret }}
                  key: db-port
            - name: PGBOUNCER_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgbouncer.credentialsSecret }}
                  key: db-name
            - name: PGBOUNCER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgbouncer.credentialsSecret }}
                  key: db-user
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: false  # pgbouncer writes its pid file
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.pgbouncer.listenPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.pgbouncer.listenPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
        {{- end }}
